{% extends "base.html" %}

{% block content %}
<h1>Data Asisten Lab. Komputer</h1>

<div style="margin-bottom: 20px;">
    <a href="{{ url_for('main.tambah_asisten_lab') }}" class="btn">Tambah Asisten Lab</a>
</div>

<table>
    <thead>
        <tr>
            <th>Kode Asisten</th>
            <th>Nama</th>
            <th>Aksi</th>
        </tr>
    </thead>
    <tbody>
        {% for a in asisten_list %}
        <tr>
            <td>{{ a.kode_asisten }}</td>
            <td>{{ a.nama }}</td>
            <td>
                <a href="{{ url_for('main.edit_asisten_lab', id=a.id) }}" class="btn"
                    style="background: #ffc107; color: black;">Edit</a>
                <a href="{{ url_for('main.delete_asisten_lab', id=a.id) }}" class="btn btn-danger"
                    onclick="return confirm('Yakin hapus data ini?')">Hapus</a>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3">Belum ada data asisten laboratorium.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
