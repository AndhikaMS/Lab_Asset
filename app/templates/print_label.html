<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Label Aset {{ asset.kode_aset }}</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
        }

        .label-container {
            width: 13.5cm;
            min-height: 5.5cm;
            border: 2px solid #000;
            background: #fff;
            padding: 10px 14px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header with logos and institutional text */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #000;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .header .logo {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .header .logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .header .text {
            flex: 1;
            text-align: center;
            padding: 0 10px;
        }

        .header .text .inst-yayasan {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #000;
            margin: 0 0 3px;
            text-transform: uppercase;
        }

        .header .text .inst-univ {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.8px;
            color: #000;
            margin: 0;
            text-transform: uppercase;
        }

        /* Body with QR code on left and metadata table on right */
        .body {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }

        .qr-box {
            width: 120px;
            height: 120px;
            border: 1.5px solid #000;
            padding: 4px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: #fff;
        }

        .qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .meta-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .meta-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
            line-height: 1.4;
        }

        .meta-table tr td {
            padding: 4px 0;
            vertical-align: top;
        }

        .meta-table .field-label {
            width: 70px;
            font-weight: 700;
            color: #000;
            letter-spacing: 0.5px;
        }

        .meta-table .field-separator {
            width: 14px;
            font-weight: 700;
            text-align: center;
            color: #000;
        }

        .meta-table .field-value {
            font-weight: 700;
            color: #000;
            word-break: break-word;
        }

        .meta-table .field-value.code-font {
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            font-weight: 800;
        }

        @media print {
            body {
                background-color: transparent;
                padding: 0;
                margin: 0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .label-container {
                border: 2px solid #000;
                page-break-inside: avoid;
            }

            @page {
                size: auto;
                margin: 0.5cm;
            }
        }
    </style>
</head>

<body onload="window.print()">
    <div class="label-container">
        <!-- Header: [LOGO UNIBBA]  YAYASAN & UNIVERSITAS  [LOGO FTI] -->
        <div class="header">
            <div class="logo">
                <img src="{{ url_for('static', filename='img/logo1.png') }}" alt="Logo UNIBBA"
                    onerror="this.style.display='none'">
            </div>
            <div class="text">
                <div class="inst-yayasan">YAYASAN PENDIDIKAN BALE BANDUNG</div>
                <div class="inst-univ">UNIVERSITAS BALE BANDUNG</div>
            </div>
            <div class="logo">
                <img src="{{ url_for('static', filename='img/logo2.png') }}" alt="Logo FTI"
                    onerror="this.style.display='none'">
            </div>
        </div>

        <!-- Body: [QR CODE]  KODE, NAMA, LOKASI -->
        <div class="body">
            <div class="qr-box">
                {% if asset.qr_code_path %}
                <img src="{{ url_for('static', filename=asset.qr_code_path) }}" alt="QR Code">
                {% else %}
                <span style="font-size: 11px; text-align: center; color: #666;">QR Code</span>
                {% endif %}
            </div>
            <div class="meta-info">
                <table class="meta-table">
                    <tr>
                        <td class="field-label">KODE</td>
                        <td class="field-separator">:</td>
                        <td class="field-value code-font">{{ asset.format_label() or asset.kode_aset }}</td>
                    </tr>
                    <tr>
                        <td class="field-label">NAMA</td>
                        <td class="field-separator">:</td>
                        <td class="field-value">{{ asset.nama_aset }}</td>
                    </tr>
                    <tr>
                        <td class="field-label">LOKASI</td>
                        <td class="field-separator">:</td>
                        <td class="field-value">{{ asset.location.nama_lab if asset.location else '-' }}</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
